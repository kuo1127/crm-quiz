<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM 商品分析師刷題</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one centered answer-sheet column; home offers two entry blocks, quiz view is a single question with scantron-style option bubbles. */
:root{
  color-scheme:light;
  --bg:#eef3f0; --surface:#fafdfb; --ink:#14211d; --muted:#586861; --line:#cbd8d2;
  --accent:#0d6b56; --accent-ink:#ffffff; --accent-soft:#dcece6;
  --good:#1b7a49; --good-bg:#dff1e6; --bad:#b0352d; --bad-bg:#f8e1de;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1614; --surface:#15201d; --ink:#e3eee9; --muted:#8ea39a; --line:#2a3a35;
    --accent:#4cc3a0; --accent-ink:#06211a; --accent-soft:#17302a;
    --good:#58c78a; --good-bg:#14301f; --bad:#f0827a; --bad-bg:#37191a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#15201d; --ink:#e3eee9; --muted:#8ea39a; --line:#2a3a35;
  --accent:#4cc3a0; --accent-ink:#06211a; --accent-soft:#17302a;
  --good:#58c78a; --good-bg:#14301f; --bad:#f0827a; --bad-bg:#37191a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.7;
  padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:720px;margin:0 auto;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* home */
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
h1{font-size:clamp(34px,9vw,54px);line-height:1.12;font-weight:900;margin:0 0 14px;text-wrap:balance;letter-spacing:.01em}
.lede{color:var(--muted);margin:0 0 24px;max-width:46ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0 0 28px;overflow:hidden}
.facts div{padding:10px 14px;border-right:1px solid var(--line);min-width:0}
.facts div:last-child{border-right:0}
.facts dt{font-size:12px;color:var(--muted);letter-spacing:.06em}
.facts dd{margin:0;font-family:var(--font-mono);font-weight:700;font-size:20px;line-height:1.4}
.modes{display:grid;gap:14px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:20px;display:grid;gap:12px;min-width:0}
.mode h2{margin:0;font-size:22px;font-weight:700;line-height:1.3}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .row{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.check{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:18px 0 0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 18px;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.small{min-height:36px;padding:4px 12px;font-size:14px}

/* quiz */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
.top .grow{flex:1;min-width:0}
.label{font-weight:700}
.stats{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 14px}
.stats b{color:var(--ink);font-family:var(--font-mono);font-weight:700}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--accent)}
.qno{font-family:var(--font-mono);font-size:13px;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
.stem{font-size:19px;line-height:1.75;font-weight:500;margin:0 0 20px;text-wrap:pretty}
.opts{display:grid;gap:10px;margin:0 0 18px}
.opt{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;min-height:54px;min-width:0}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt .txt{min-width:0;overflow-wrap:anywhere}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;
  font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;white-space:nowrap}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.pick .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:var(--bg)}
.opt.ok .tag{color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.no .tag{color:var(--bad)}
.fb{border-radius:8px;padding:10px 14px;margin:0 0 16px;font-weight:700}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.nav .r{display:flex;gap:10px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin-top:18px}

/* panel */
.panel{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;margin-bottom:20px;display:grid;gap:12px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 14px;font-size:14px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.cell{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-height:34px;font-family:var(--font-mono);font-size:13px;padding:0}
.cell.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.cell.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);text-decoration:underline}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
.legend{font-size:12px;color:var(--muted)}

/* result */
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin:6px 0 4px}
.score .n{font-family:var(--font-mono);font-weight:700;font-size:clamp(56px,16vw,88px);line-height:1}
.score .u{font-size:22px;font-weight:700}
.pill{display:inline-block;padding:2px 14px;border-radius:999px;font-weight:700;font-size:15px}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.sum{color:var(--muted);margin:0 0 22px}
.sum b{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 28px}
h3{font-size:18px;margin:0 0 12px}
.wl{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.wl li{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;min-width:0}
.wl .q{margin:2px 0 8px;font-weight:500}
.wl .a{font-size:14px;margin:0;overflow-wrap:anywhere}
.wl .a b.g{color:var(--good)} .wl .a b.r{color:var(--bad)}
@media (max-width:480px){
  .stem{font-size:18px}
  .opt{grid-template-columns:30px 1fr;}
  .opt .tag{grid-column:2;margin-top:-6px}
}
@media (prefers-reduced-motion:no-preference){
  .bar i{transition:width .25s ease}
}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

var L=['A','B','C','D'];
var KEY='crm-quiz-all-v1';
var app=document.getElementById('app');
var saved={ans:{},pos:0};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.ans){saved={ans:o.ans,pos:(o.pos|0)}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function norm(s){return s.replace(/[\s?？。，、:：.,]/g,'')}
var seen={},pool=[],dups=0;
Q.forEach(function(q,i){var k=norm(q[0])+q[1].join('|');if(seen[k]!==undefined){dups++}else{seen[k]=i;pool.push(i)}});
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function stats(ans){var n=0,c=0;for(var k in ans){n++;if(ans[k]===Q[k][2])c++}return{n:n,c:c}}

var S={view:'home',timed:false};
var timer=null;
function stopTimer(){if(timer){clearInterval(timer);timer=null}}

function startRandom(){
  var list=shuffle(pool).slice(0,50);
  S={view:'quiz',kind:'r50',list:list,pos:0,ans:{},sel:{},t0:Date.now(),limit:S.timed?3600:0,timed:S.timed};
  startTick();render();window.scrollTo(0,0);
}
function startRetry(list){
  S={view:'quiz',kind:'retry',list:list,pos:0,ans:{},sel:{},t0:Date.now(),limit:0,timed:S.timed};
  stopTimer();render();window.scrollTo(0,0);
}
function allList(filter){
  var out=[];
  for(var i=0;i<Q.length;i++){
    var a=saved.ans[i];
    if(filter==='all'||(filter==='todo'&&a===undefined)||(filter==='wrong'&&a!==undefined&&a!==Q[i][2]))out.push(i);
  }
  return out;
}
function startAll(){
  stopTimer();
  var list=allList('all');
  var p=Math.min(Math.max(saved.pos|0,0),Q.length-1);
  S={view:'quiz',kind:'all',filter:'all',list:list,pos:p,ans:saved.ans,sel:{},panel:false,confirm:false,timed:S.timed};
  render();window.scrollTo(0,0);
}
function startTick(){
  stopTimer();
  if(!S.limit)return;
  timer=setInterval(function(){
    var left=S.limit-(Date.now()-S.t0)/1000;
    var el=document.getElementById('tm');
    if(el)el.textContent=fmt(left);
    if(left<=0){finish()}
  },500);
}
function finish(){
  stopTimer();
  if(S.sel){for(var k in S.sel){if(S.ans[k]===undefined)S.ans[k]=S.sel[k]}}
  S.view='result';S.elapsed=(Date.now()-S.t0)/1000;
  render();window.scrollTo(0,0);
}

function render(){
  if(S.view==='home')app.innerHTML=homeHtml();
  else if(S.view==='quiz')app.innerHTML=quizHtml();
  else app.innerHTML=resultHtml();
}

function homeHtml(){
  var st=stats(saved.ans);
  var h='';
  h+='<p class="eyebrow">微析科技 · 顧客關係管理商品分析師</p>';
  h+='<h1>CRM 商品分析師<br>題庫刷題</h1>';
  h+='<p class="lede">共 '+Q.length+' 題單選題。先選答案，按「下一步」才會顯示正確答案，隨時可以換題或離開。</p>';
  h+='<dl class="facts"><div><dt>題庫</dt><dd>'+Q.length+'</dd></div><div><dt>每次檢定</dt><dd>50 題</dd></div><div><dt>每題</dt><dd>2 分</dd></div><div><dt>及格</dt><dd>70 分</dd></div><div><dt>時間</dt><dd>60 分</dd></div></dl>';
  h+='<div class="modes">';
  h+='<section class="mode"><h2>隨機 50 題</h2><p>從題庫隨機抽 50 題，交卷後算分並列出錯題。</p>';
  h+='<div class="row"><button class="btn primary" data-act="r50">開始抽題</button>';
  h+='<label class="check"><input type="checkbox" id="timed"'+(S.timed?' checked':'')+'>模擬計時 60 分鐘</label></div></section>';
  h+='<section class="mode"><h2>全部 '+Q.length+' 題</h2><p>依題號順序練習，進度存在這個瀏覽器裡。可以只看答錯或還沒做的題目。</p>';
  h+='<div class="row"><button class="btn primary" data-act="all">'+(st.n?'繼續練習（第 '+((saved.pos|0)+1)+' 題）':'開始練習')+'</button>';
  if(st.n)h+='<span class="stats">已作答 <b>'+st.n+'</b> / '+Q.length+'　答對 <b>'+st.c+'</b></span>';
  h+='</div></section></div>';
  if(dups)h+='<p class="note">題庫中有 '+dups+' 題內容重複，隨機抽題時只算一次。</p>';
  return h;
}

function quizHtml(){
  var idx=S.list[S.pos];
  var h='';
  var st=stats(S.ans);
  var total=S.list.length;
  var label=S.kind==='r50'?'隨機 50 題':(S.kind==='retry'?'重做錯題':'全部 '+Q.length+' 題');
  h+='<div class="top"><button class="btn small" data-act="home">← 首頁</button><span class="label grow">'+label+'</span>';
  if(S.kind==='all')h+='<button class="btn small" data-act="panel" aria-expanded="'+(!!S.panel)+'">題號表</button>';
  else h+='<button class="btn small" data-act="finish">交卷</button>';
  h+='</div>';
  h+='<div class="stats" style="margin-bottom:8px"><span>第 <b>'+(S.pos+1)+'</b> / '+total+' 題</span><span>答對 <b>'+st.c+'</b></span><span>答錯 <b>'+(st.n-st.c)+'</b></span>';
  if(S.limit)h+='<span>剩餘 <b id="tm">'+fmt(S.limit-(Date.now()-S.t0)/1000)+'</b></span>';
  h+='</div>';
  var pct=total?((S.pos+1)/total*100):0;
  h+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
  if(S.kind==='all'&&S.panel)h+=panelHtml();
  if(!total){
    h+='<p>這個篩選條件下沒有題目。</p>';
    return h;
  }
  var q=Q[idx],a=S.ans[idx],done=a!==undefined,pend=S.sel[idx];
  h+='<div class="qno">題庫第 '+(idx+1)+' 題</div>';
  h+='<p class="stem">'+esc(q[0])+'</p>';
  h+='<div class="opts" role="group" aria-label="選項">';
  for(var i=0;i<4;i++){
    var cls='opt',tag='';
    if(done){
      if(i===q[2]){cls+=' ok';tag='正確答案'}
      else if(i===a){cls+=' no';tag='你的選擇'}
    }else if(i===pend){cls+=' pick';tag='已選'}
    h+='<button class="'+cls+'" data-opt="'+i+'"'+(done?' disabled':'')+'><span class="bub">'+L[i]+'</span><span class="txt">'+esc(q[1][i])+'</span>'+(tag?'<span class="tag">'+tag+'</span>':'')+'</button>';
  }
  h+='</div>';
  if(done){
    h+=a===q[2]?'<div class="fb ok" role="status">答對了</div>':'<div class="fb no" role="status">答錯了，正確答案是 '+L[q[2]]+'</div>';
  }
  var last=S.pos>=total-1;
  h+='<div class="nav"><button class="btn" data-act="prev"'+(S.pos<=0?' disabled':'')+'>上一題</button><div class="r">';
  if(!done)h+='<button class="btn'+(pend!==undefined?' primary':'')+'" data-act="reveal"'+(pend===undefined?' disabled':'')+'>下一步</button>';
  else if(last&&S.kind!=='all')h+='<button class="btn primary" data-act="finish">交卷看成績</button>';
  else h+='<button class="btn primary" data-act="next"'+(last?' disabled':'')+'>下一題</button>';
  h+='</div></div>';
  h+='<p class="hint">先選答案，按「下一步」才會顯示正確答案。鍵盤：1–4 或 A–D 選答案，Enter 下一步，← 上一題</p>';
  return h;
}

function panelHtml(){
  var h='<div class="panel"><div class="chips">';
  [['all','全部'],['todo','未作答'],['wrong','答錯']].forEach(function(f){
    h+='<button class="chip" data-filter="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+'</button>';
  });
  h+='</div><div class="grid">';
  var cur=S.list[S.pos];
  S.list.forEach(function(i,p){
    var a=S.ans[i],c='cell';
    if(a!==undefined)c+=a===Q[i][2]?' ok':' no';
    if(i===cur)c+=' cur';
    h+='<button class="'+c+'" data-jump="'+p+'" aria-label="第 '+(i+1)+' 題">'+(i+1)+'</button>';
  });
  h+='</div><div class="legend">綠色答對 · 紅色底線答錯 · 空白未作答</div>';
  h+='<div><button class="btn small" data-act="reset">'+(S.confirm?'再按一次確認清除全部進度':'清除全部進度')+'</button></div>';
  h+='</div>';
  return h;
}

function resultHtml(){
  var st=stats(S.ans),total=S.list.length;
  var h='';
  var isExam=S.kind==='r50';
  h+='<p class="eyebrow">'+(isExam?'隨機 50 題成績':'重做錯題成績')+'</p>';
  if(isExam){
    var score=st.c*2;
    h+='<div class="score"><span class="n">'+score+'</span><span class="u">分</span><span class="pill '+(score>=70?'ok':'no')+'">'+(score>=70?'及格':'未及格')+'</span></div>';
  }else{
    h+='<div class="score"><span class="n">'+st.c+'</span><span class="u">/ '+total+' 題答對</span></div>';
  }
  h+='<p class="sum">答對 <b>'+st.c+'</b> 題，答錯 <b>'+(st.n-st.c)+'</b> 題，未作答 <b>'+(total-st.n)+'</b> 題，用時 <b>'+fmt(S.elapsed)+'</b>。'+(isExam?'及格線 70 分。':'')+'</p>';
  var wrong=S.list.filter(function(i){return S.ans[i]!==Q[i][2]});
  h+='<div class="acts">';
  if(isExam)h+='<button class="btn primary" data-act="r50">再抽 50 題</button>';
  if(wrong.length)h+='<button class="btn'+(isExam?'':' primary')+'" data-act="retry">只重做這 '+wrong.length+' 題</button>';
  h+='<button class="btn" data-act="home">回首頁</button></div>';
  if(wrong.length){
    h+='<h3>需要複習的題目</h3><ol class="wl">';
    wrong.forEach(function(i){
      var q=Q[i],a=S.ans[i];
      h+='<li><div class="qno">題庫第 '+(i+1)+' 題</div><p class="q">'+esc(q[0])+'</p>';
      h+='<p class="a"><b class="g">正確 '+L[q[2]]+'</b>　'+esc(q[1][q[2]])+'</p>';
      h+='<p class="a">'+(a===undefined?'<b class="r">未作答</b>':'<b class="r">你選 '+L[a]+'</b>　'+esc(q[1][a]))+'</p></li>';
    });
    h+='</ol>';
  }else{
    h+='<p>全部答對。</p>';
  }
  return h;
}

function choose(i){
  var idx=S.list[S.pos];
  if(S.ans[idx]!==undefined)return;
  S.sel[idx]=i;
  render();
}
function reveal(){
  var idx=S.list[S.pos];
  if(S.ans[idx]!==undefined||S.sel[idx]===undefined)return;
  S.ans[idx]=S.sel[idx];
  if(S.kind==='all'){saved.pos=idx;save()}
  render();
  var fb=app.querySelector('.fb');
  if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:'nearest'});
}
function advance(){
  var idx=S.list[S.pos];
  if(S.ans[idx]===undefined){reveal();return}
  if(S.pos>=S.list.length-1){if(S.kind!=='all')finish();return}
  go(1);
}
function go(d){
  var p=S.pos+d;
  if(p<0||p>=S.list.length)return;
  S.pos=p;
  if(S.kind==='all'){saved.pos=S.list[p];save()}
  render();window.scrollTo(0,0);
}

app.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(!t)return;
  if(t.hasAttribute('data-opt')){choose(+t.getAttribute('data-opt'));return}
  if(t.hasAttribute('data-jump')){S.pos=+t.getAttribute('data-jump');saved.pos=S.list[S.pos];save();S.panel=false;render();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-filter')){
    var f=t.getAttribute('data-filter');
    S.filter=f;S.list=allList(f);S.pos=0;
    if(f==='all')S.pos=Math.min(Math.max(saved.pos|0,0),Q.length-1);
    S.confirm=false;render();return;
  }
  var act=t.getAttribute('data-act');
  if(act==='r50')startRandom();
  else if(act==='all')startAll();
  else if(act==='home'){stopTimer();S={view:'home',timed:S.timed};render();window.scrollTo(0,0)}
  else if(act==='prev')go(-1);
  else if(act==='next')go(1);
  else if(act==='reveal')reveal();
  else if(act==='finish')finish();
  else if(act==='panel'){S.panel=!S.panel;render()}
  else if(act==='retry'){startRetry(S.list.filter(function(i){return S.ans[i]!==Q[i][2]}))}
  else if(act==='reset'){
    if(!S.confirm){S.confirm=true;render();return}
    saved={ans:{},pos:0};save();
    S.ans=saved.ans;S.sel={};S.filter='all';S.list=allList('all');S.pos=0;S.confirm=false;render();
  }
});
app.addEventListener('change',function(e){
  if(e.target.id==='timed')S.timed=e.target.checked;
});
document.addEventListener('keydown',function(e){
  if(S.view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key.toLowerCase(),m={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3};
  if(k in m){choose(m[k]);e.preventDefault()}
  else if(e.key==='Enter'&&!(e.target&&e.target.closest&&e.target.closest('button'))){advance();e.preventDefault()}
  else if(e.key==='ArrowLeft'){go(-1)}
});
render();
</script>

</body>
</html>
